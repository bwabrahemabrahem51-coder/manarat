name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files and Android project
        run: |
          mkdir -p www
          cp index.html sw.js www/
          npm install
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, glob
          from PIL import Image, ImageDraw
          files = [f for f in ['icon.png','icon.jpg','icon.jpeg'] if os.path.exists(f)]
          if not files:
              raise SystemExit('ERROR: icon.png not found in repo root')
          img = Image.open(files[0]).convert('RGBA')
          side = min(img.size)
          img = img.crop(((img.width-side)//2, (img.height-side)//2, (img.width+side)//2, (img.height+side)//2))
          res = 'android/app/src/main/res'
          sizes = {'mdpi':(48,108),'hdpi':(72,162),'xhdpi':(96,216),'xxhdpi':(144,324),'xxxhdpi':(192,432)}
          for d,(s,fg) in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              # Adaptive icon XML requires BOTH foreground and background mipmap assets.
              img.resize((fg,fg), Image.LANCZOS).save(f'{folder}/ic_launcher_foreground.png')
              Image.new('RGBA', (s,s), (116,31,53,255)).save(f'{folder}/ic_launcher_background.png')
              sq = img.resize((s,s), Image.LANCZOS)
              sq.save(f'{folder}/ic_launcher.png')
              mask = Image.new('L',(s*4,s*4),0)
              ImageDraw.Draw(mask).ellipse((0,0,s*4-1,s*4-1), fill=255)
              mask = mask.resize((s,s), Image.LANCZOS)
              rd = Image.new('RGBA',(s,s),(0,0,0,0)); rd.paste(sq,(0,0),mask)
              rd.save(f'{folder}/ic_launcher_round.png')
          print('icon done from', files[0])
          PY
          for f in android/app/src/main/res/values/ic_launcher_background.xml; do
            [ -f "$f" ] && sed -i 's/#[0-9A-Fa-f]\{6\}/#741F35/' "$f"
          done
          true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sijil-aqari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-aqari-apk
          path: sijil-aqari.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: سجل العقاري v${{ github.run_number }}
          files: sijil-aqari.apk
