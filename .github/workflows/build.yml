name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files and Android project
        run: |
          mkdir -p www
          cp index.html sw.js www/
          npm install
          npx cap add android

      - name: App icon
        run: |
          ICON=""
          [ -f icon.png ] && ICON=icon.png
          [ -z "$ICON" ] && [ -f icon.jpg ] && ICON=icon.jpg
          if [ -n "$ICON" ]; then
            EXT="${ICON##*.}"
            mkdir -p assets
            cp "$ICON" "assets/icon-only.$EXT"
            cp "$ICON" "assets/icon-foreground.$EXT"
            npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          else
            echo "No icon.png found, using default icon"
          fi

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sijil-aqari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-aqari-apk
          path: sijil-aqari.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: سجل العقاري v${{ github.run_number }}
          files: sijil-aqari.apk
