
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android
        run: |
          mkdir -p www
          cp index.html sw.js www/ 2>/dev/null || cp index.html www/

          npm install
          npx cap add android
          npx cap sync android

      - name: Enable Full Screen
        run: |
          python3 <<'PY'
          import glob

          files = glob.glob(
              'android/app/src/main/java/**/MainActivity.kt',
              recursive=True
          )

          if not files:
              raise SystemExit("MainActivity.kt not found")

          path = files[0]

          with open(path, encoding="utf-8") as f:
              src = f.read()

          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in src:
              fullscreen = """
              override fun onCreate(
                  savedInstanceState: android.os.Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  window.decorView.systemUiVisibility = (
                      android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  )
              }
              """

              pos = src.rfind("}")
              if pos == -1:
                  raise SystemExit("MainActivity class not found")

              src = src[:pos] + fullscreen + "\n" + src[pos:]

              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)

          print("Fullscreen enabled")

          PY

      - name: Generate App Icon
        run: |
          pip install pillow

          python3 <<'PY'
          import os
          from PIL import Image, ImageDraw

          if not os.path.exists("icon.png"):
              raise SystemExit("icon.png not found")

          img = Image.open("icon.png").convert("RGBA")

          side = min(img.size)

          img = img.crop((
              (img.width-side)//2,
              (img.height-side)//2,
              (img.width+side)//2,
              (img.height+side)//2
          ))

          res = "android/app/src/main/res"

          sizes = {
              "mdpi": (48,108),
              "hdpi": (72,162),
              "xhdpi": (96,216),
              "xxhdpi": (144,324),
              "xxxhdpi": (192,432)
          }

          for density, (s, fg) in sizes.items():

              folder = f"{res}/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              img.resize((fg,fg), Image.LANCZOS).save(
                  f"{folder}/ic_launcher_foreground.png"
              )

              Image.new(
                  "RGBA",
                  (s,s),
                  (116,31,53,255)
              ).save(
                  f"{folder}/ic_launcher_background.png"
              )

              sq = img.resize((s,s), Image.LANCZOS)

              sq.save(f"{folder}/ic_launcher.png")

              mask = Image.new("L",(s*4,s*4),0)

              ImageDraw.Draw(mask).ellipse(
                  (0,0,s*4-1,s*4-1),
                  fill=255
              )

              mask = mask.resize((s,s),Image.LANCZOS)

              rd = Image.new("RGBA",(s,s),(0,0,0,0))

              rd.paste(sq,(0,0),mask)

              rd.save(f"{folder}/ic_launcher_round.png")

          print("Icon generated")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sijil-aqari.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sijil-aqari-apk
          path: sijil-aqari.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: سجل العقاري v${{ github.run_number }}
          files: sijil-aqari.apk
